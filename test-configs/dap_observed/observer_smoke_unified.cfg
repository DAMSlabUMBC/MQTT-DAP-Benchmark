# Benchmark settings
node_name: "ObserverNode"
client_module_name: "ClientInterface"
output_dir: "logs"

reg_by_msg_reg_topic: "$DAP/purpose_management"
reg_by_topic_pub_reg_topic: "$MP_REG"
reg_by_topic_sub_reg_topic: "$DAP/SP_reg"

or_topic_name: "OR"
ors_topic_name: "ORS"
on_topic_name: "ON"
onp_topic_name: "ONP"
osys_topic_name: "$OSYS"
operational_response_topic_prefix: "op_resp"
operational_purpose: "DAP_OP"

purpose_management_method: 3

monitor_broker: false
node_exporter_url: http://mosquitto:9100/metrics
monitor_interval_ms: 1000

test:
    name: dap_smoke_observed
    duration_ms: 45000
    data_qos: 0

    device_instances:
        - device_def_id: psmark_observer
          instance_id: obs_finance
          purpose_filter: finance.reporting
          count: 1

        - device_def_id: psmark_observer
          instance_id: obs_negative
          purpose_filter: audit.compliance
          count: 1

    scheduled_events:
        - time_ms: 0
          type: connect_all
          description: Connect observer subscribers

        - time_ms: 45000
          type: disconnect_all

    op_send_rate: 0
    c1_reg_ops: []
    c1_ops: []
    c2_ops: []
    c3_ops: []

device_definitions:
    - id: "psmark_observer"
      type: "subscriber"
      topic_filter: "ps_bench/device/qos_0/+"

purpose_definitions:
    - id: "finance.reporting"
      description: "Finance reporting"
    - id: "audit.compliance"
      description: "Negative-case purpose with no matching publishers"
