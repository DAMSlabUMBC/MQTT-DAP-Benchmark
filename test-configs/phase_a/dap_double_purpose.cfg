# Benchmark settings
node_name: "ObserverNode"
client_module_name: "ClientInterface"
output_dir: "logs"

reg_by_msg_reg_topic: "$DAP/purpose_management"
reg_by_topic_pub_reg_topic: "$DAP/MP_reg"
reg_by_topic_sub_reg_topic: "$DAP/SP_reg"

or_topic_name: "OR"
ors_topic_name: "OP_REQ"
on_topic_name: "ON"
onp_topic_name: "OP_NOTIF"
osys_topic_name: "$OP_SYS"
operational_response_topic_prefix: "op_resp"
operational_purpose: "DAP_OP"

purpose_management_method: 3

monitor_broker: false
node_exporter_url: http://mosquitto:9100/metrics
monitor_interval_ms: 1000

test:
    name: dap_double_purpose
    duration_ms: 180100
    data_qos: 0

    device_instances:
        - device_def_id: psmark_observer
          instance_id: obs_p1
          purpose_filter: p1
          count: 1

        - device_def_id: psmark_observer
          instance_id: obs_p2
          purpose_filter: p2
          count: 1

        - device_def_id: psmark_observer
          instance_id: obs_negative
          purpose_filter: p99
          count: 1

    scheduled_events:
        - time_ms: 0
          type: connect_all
          description: Connect observer subscribers

        - time_ms: 180100
          type: disconnect_all

    op_send_rate: 0
    c1_reg_ops: []
    c1_ops: []
    c2_ops: []
    c3_ops: []

device_definitions:
    - id: "psmark_observer"
      type: "subscriber"
      topic_filter: "ps_bench/device/qos_0/+"

purpose_definitions:
    - id: "p1"
      description: "Purpose 1"
    - id: "p2"
      description: "Purpose 2"
    - id: "p99"
      description: "Negative-case purpose with no matching publishers"
